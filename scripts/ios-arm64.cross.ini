# Meson cross-file for iOS arm64 builds.
#
# This is for the embed/ project (libishembed + libishffi). iSH itself
# uses Xcode for iOS builds; we mirror its toolchain and SDK selection
# here.
#
# The script embed/scripts/ios-meson-env.sh resolves:
#   - SDKROOT  via `xcrun --sdk iphoneos --show-sdk-path`
#   - CC       via `xcrun --find clang`
# and exports them as ISH_IOS_CC / ISH_IOS_SDKROOT before invoking meson.
#
# IMPORTANT: do NOT inherit CC, CFLAGS, RUSTC_WRAPPER, SDKROOT from a
# parent shell — that breaks Meson host probes. Use the helper script
# which scrubs them.

[binaries]
c       = ['env', 'ISH_IOS_CC',  'sh', '-c', 'exec "$ISH_IOS_CC" "$@"', '_']
ar      = 'ar'
strip   = 'strip'
pkg-config = 'pkg-config'

[host_machine]
system     = 'darwin'
cpu_family = 'aarch64'
cpu        = 'arm64'
endian     = 'little'

[built-in options]
c_args   = ['-arch', 'arm64', '-isysroot', '@ISH_IOS_SDKROOT@',
            '-mios-version-min=18.0', '-fembed-bitcode-marker',
            '-DTARGET_OS_IPHONE=1']
c_link_args = ['-arch', 'arm64', '-isysroot', '@ISH_IOS_SDKROOT@',
            '-mios-version-min=18.0']
default_library = 'static'

[properties]
needs_exe_wrapper = true
