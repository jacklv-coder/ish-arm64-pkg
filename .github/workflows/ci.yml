name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs-reproducibility:
    name: RootFS reproducibility (no artifact upload)
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository and pinned iSH source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out pinned iSH source
        run: |
          git submodule sync -- third_party/ish
          git -c 'url.https://github.com/.insteadOf=ssh://git@ssh.github.com:443/' \
            submodule update --init --checkout -- third_party/ish
          test "$(git -C third_party/ish rev-parse HEAD)" = \
            "$(git ls-tree HEAD third_party/ish | awk '{print $3}')"

      - name: Install RootFS build tools
        run: brew install meson ninja pkgconf libarchive zig

      - name: Test deterministic archive helper
        run: scripts/test-deterministic-rootfs-tar.sh

      - name: Build and compare two RootFS candidates
        env:
          # The candidate entry point must ignore ambient compiler selection so
          # its receipt always describes the toolchain that performed the build.
          CC: /usr/bin/false
          ZIG: /usr/bin/false
          TARGET_TRIPLE: invalid-ambient-target
          MAKEFLAGS: CC=/usr/bin/false ZIG=/usr/bin/false
          PKG_CONFIG_PATH: /nonexistent/ambient-pkgconfig
          PKG_CONFIG_LIBDIR: /nonexistent/ambient-pkgconfig
          PKG_CONFIG: /usr/bin/false
          TAR_OPTIONS: "--exclude=*"
          LD_LIBRARY_PATH: /nonexistent/ambient-loader
          # A forged handoff sentinel must not skip the complete environment
          # validation or cause the caller's lookalike HOME to be removed.
          ISHEMBED_ROOTFS_CANDIDATE_SANITIZED: "1"
          ISHEMBED_ROOTFS_CANDIDATE_CLEAN_HOME: ${{ runner.temp }}/ishembed-rootfs-candidate-home.ABC123
          HOME: ${{ runner.temp }}/ishembed-rootfs-candidate-home.ABC123
          AMBIENT_BYPASS_PROBE: must-be-removed
        run: |
          forged_empty_home="$RUNNER_TEMP/ishembed-rootfs-candidate-home.ZZZ999"
          mkdir -p "$forged_empty_home"
          mkdir -p "$HOME"
          touch "$HOME/.gitconfig"
          ambient_bin="$RUNNER_TEMP/ambient-path-probe"
          mkdir -p "$ambient_bin"
          for tool in mktemp chmod rm shasum; do
            cat > "$ambient_bin/$tool" <<'AMBIENT_TOOL'
          #!/bin/sh
          : > "${AMBIENT_TOOL_CALLED:?}"
          exit 97
          AMBIENT_TOOL
            chmod +x "$ambient_bin/$tool"
          done
          export AMBIENT_TOOL_CALLED="$RUNNER_TEMP/ambient-tool-called"
          export PATH="$ambient_bin:$PATH"
          scripts/prepare-rootfs-candidate.sh --help
          test -f "$HOME/.gitconfig"
          test ! -e "$AMBIENT_TOOL_CALLED"
          /bin/rm -f "$HOME/.gitconfig"
          rmdir "$HOME"

          # Run the real double build through an otherwise valid forged handoff.
          # The sanitized child may use this empty HOME, but must never delete it.
          /usr/bin/env -i \
            HOME="$forged_empty_home" \
            PATH="/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            TMPDIR="$RUNNER_TEMP" \
            LC_ALL=C LANG=C TZ=UTC \
            COPYFILE_DISABLE=1 GIT_CONFIG_NOSYSTEM=1 \
            PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 PYTHONNOUSERSITE=1 \
            HTTP_PROXY= HTTPS_PROXY= ALL_PROXY= NO_PROXY= \
            http_proxy= https_proxy= all_proxy= no_proxy= \
            SSL_CERT_FILE= SSL_CERT_DIR= \
            ISHEMBED_ROOTFS_CANDIDATE_SANITIZED=1 \
            ISHEMBED_ROOTFS_CANDIDATE_CLEAN_HOME="$forged_empty_home" \
            /bin/bash scripts/prepare-rootfs-candidate.sh --verify-only
          test -d "$forged_empty_home"
          /bin/rm -rf "$forged_empty_home"

  test-and-build:
    name: Native, Swift, and iOS 18 integration
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository and iSH source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false

      - name: Check out pinned iSH source
        run: |
          git submodule sync -- third_party/ish
          git -c 'url.https://github.com/.insteadOf=ssh://git@ssh.github.com:443/' \
            submodule update --init --checkout -- third_party/ish
          test "$(git -C third_party/ish rev-parse HEAD)" = \
            "$(git ls-tree HEAD third_party/ish | awk '{print $3}')"

      - name: Install native build tools
        run: brew install meson ninja lld zig

      - name: Validate repository metadata and scripts
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            if [[ "$before" =~ ^[0-9a-f]{40}$ && \
                  "$before" != 0000000000000000000000000000000000000000 ]] && \
               git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --check "$before..HEAD"
            else
              empty_tree="$(git hash-object -t tree /dev/null)"
              git diff --check "$empty_tree..HEAD"
            fi
          fi
          bash -n scripts/*.sh
          scripts/check-docs.sh
          scripts/test-check-docs.sh
          scripts/test-build-ios-path-safety.sh
          scripts/test-run-host-tests.sh
          scripts/test-release-tag-cas.sh
          scripts/test-release-version-policy.sh
          scripts/test-source-policy.sh
          swift package dump-package >/dev/null

      - name: Link and test Swift API against the published manifest binary
        run: scripts/test-swift-ios.sh --manifest-binary

      - name: Run deterministic native and JIT tests with sanitizers
        run: |
          meson setup build-ci-ish "$PWD/third_party/ish" \
            -Dguest_arch=arm64 \
            -Dc_args=-DISH_DISABLE_SKIP_BRK=1 \
            -Db_sanitize=address,undefined \
            -Db_lundef=false
          # The chain executable already depends on libish + libish_emu; fakefs
          # is the only additional archive consumed by the outer Meson build.
          meson compile -C build-ci-ish arm64-neon-reverse-test dirty-page-chain-test sockaddr-layout-test fakefs
          meson test -C build-ci-ish --print-errorlogs --repeat 5 \
            arm64-neon-reverse \
            sockaddr-layout \
            dirty-page-chain
          meson setup build-ci \
            -Dish_src="$PWD/third_party/ish" \
            -Dish_build="$PWD/build-ci-ish" \
            -Dguest_arch=arm64 \
            -Db_sanitize=address,undefined \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C build-ci
          meson test -C build-ci --print-errorlogs --repeat 5

      - name: Gate exact x86 dirty-page tracing
        run: |
          meson setup build-ci-ish-x86 "$PWD/third_party/ish" \
            -Dguest_arch=x86 \
            -Db_sanitize=address,undefined \
            -Db_lundef=false
          meson compile -C build-ci-ish-x86 dirty-page-trace-test
          meson test -C build-ci-ish-x86 --print-errorlogs --repeat 5 \
            dirty-page-trace

      - name: Run deterministic lifecycle tests with ThreadSanitizer
        run: |
          meson setup build-ci-ish-tsan "$PWD/third_party/ish" \
            -Dguest_arch=arm64 \
            -Dc_args=-DISH_DISABLE_SKIP_BRK=1 \
            -Db_sanitize=thread \
            -Db_lundef=false
          meson compile -C build-ci-ish-tsan dirty-page-chain-test fakefs
          meson test -C build-ci-ish-tsan --print-errorlogs \
            dirty-page-chain
          meson setup build-ci-tsan \
            -Dish_src="$PWD/third_party/ish" \
            -Dish_build="$PWD/build-ci-ish-tsan" \
            -Dguest_arch=arm64 \
            -Db_sanitize=thread \
            -Db_lundef=false \
            -Dwerror=true
          meson compile -C build-ci-tsan
          meson test -C build-ci-tsan --print-errorlogs

      - name: Build iOS 18 XCFramework
        env:
          PATH: /opt/homebrew/opt/llvm/bin:/opt/homebrew/opt/lld/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: scripts/build-ios.sh

      - name: Verify slices, ABI symbols, and final links
        run: scripts/verify-ios-artifact.sh

      - name: Link and test Swift API on an arm64 iOS simulator
        run: scripts/test-swift-ios.sh
